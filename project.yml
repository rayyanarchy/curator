name: Curator
options:
  bundleIdPrefix: app.curator
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.20
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    from: 2.9.6
targets:
  Curator:
    type: application
    platform: iOS
    sources:
      - path: Curator
    dependencies:
      - package: ZIPFoundation
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.curator.ios
        PRODUCT_NAME: Curator
        ASSETCATALOG_COMPILER_APPICON_NAME: Curator
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Curator
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - CuratorTests
  CuratorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CuratorTests
    dependencies:
      - target: Curator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.curator.ios.tests
        GENERATE_INFOPLIST_FILE: YES
  CuratorImportSmoke:
    type: tool
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: Curator/Models
      - path: Curator/Services
      - path: Tools/ImportSmoke
    dependencies:
      - package: ZIPFoundation
      - package: SwiftSoup
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.curator.import-smoke
        PRODUCT_NAME: CuratorImportSmoke
        GENERATE_INFOPLIST_FILE: YES
